    <script>
      // Paint with the saved mode instantly, before React mounts.
      try {
        var savedMode = localStorage.getItem('nammy-theme');
        var dark = savedMode === 'dark' || (!savedMode && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var savedTheme = localStorage.getItem('nammy-color-theme');
        if (savedTheme) document.documentElement.dataset.colorTheme = savedTheme;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Open the audio hosts early so pressing play does not wait on DNS/TLS. -->

    <link rel="preconnect" href="https://media-r2.podeo.co" crossorigin />
