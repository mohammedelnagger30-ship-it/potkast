<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13785C"/>
      <stop offset="0.52" stop-color="#0F6E56"/>
      <stop offset="1" stop-color="#073B2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B84B"/>
      <stop offset="1" stop-color="#FFD37A"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#03271E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
    <circle cx="256" cy="256" r="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

    <g filter="url(#softShadow)">
      <rect x="151" y="296" width="18" height="40" rx="9" fill="#FFFFFF" fill-opacity="0.96"/>
      <rect x="183" y="260" width="18" height="76" rx="9" fill="#FFFFFF" fill-opacity="0.96"/>
      <rect x="215" y="216" width="18" height="120" rx="9" fill="#FFFFFF" fill-opacity="0.96"/>
      <rect x="247" y="176" width="18" height="160" rx="9" fill="url(#gold)"/>
      <rect x="279" y="216" width="18" height="120" rx="9" fill="#FFFFFF" fill-opacity="0.96"/>
      <rect x="311" y="260" width="18" height="76" rx="9" fill="#FFFFFF" fill-opacity="0.96"/>
      <rect x="343" y="296" width="18" height="40" rx="9" fill="#FFFFFF" fill-opacity="0.96"/>
    </g>
  </g>
</svg>
